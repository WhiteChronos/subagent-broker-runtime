name: Dependency Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/broker-independent-runtime
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate exact dependency lock
        run: npm install --package-lock-only
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock Broker runtime dependencies"
            git push origin HEAD:feat/broker-independent-runtime
          fi
