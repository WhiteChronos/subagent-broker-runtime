name: Broker Runtime CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/broker-independent-runtime
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Run complete test suite
        run: npm test
      - name: Verify portable and Codex manifests
        run: node scripts/generate-compat-manifests.mjs --check
      - name: Verify stdio MCP health with no real child
        run: node scripts/healthcheck-stdio.mjs
      - name: Verify self-contained Skill package
        run: node scripts/check-skill-package.mjs
